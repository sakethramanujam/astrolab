name: exoplanet-search site

on:
  push:
    branches: [exoplanet-search]
    paths: ["exoplanet_search/site/**", ".github/workflows/exoplanet-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Privacy guard
        run: |
          if grep -rIl -i -E '192\.168\.|(^|[^0-9.])100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|/home/|/Users/' exoplanet_search/site; then
            echo "::error::machine-specific strings in site"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: exoplanet_search/site
      - id: deployment
        uses: actions/deploy-pages@v4
